manifestVersion: 1.3
id: koningkoffie-reactive-resume
category: files
name: Reactive Resume
version: "5.3.1"
tagline: Create and manage your resume on your own Umbrel
icon: https://raw.githubusercontent.com/amruthpillai/reactive-resume/v5.3.0/apps/web/public/favicon.svg
description: >-
  Create professional resumes with Reactive Resume. Choose a template, customize
  your resume, and export it as a PDF. Accounts, resumes, and uploads are stored
  on your Umbrel.


  Open the app through your Umbrel and create your own account on first launch.
  Use your Umbrel's local IPv4 address to sign in.
  This installation is configured for personal use on your local network.


  Email delivery is not configured, so password recovery by email requires
  additional SMTP configuration. The AI Agent workspace is not included
  in this basic installation.
