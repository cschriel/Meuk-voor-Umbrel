version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: koningkoffie-relay_server_1
      APP_PORT: 8081

  server:
    image: ghcr.io/cschriel/relay-av-room-control:0.8.2-1
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 30s
    environment:
      NODE_ENV: production
      PORT: 8081
      TZ: Europe/Amsterdam
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
