name: Validate Checkmate package

on:
  pull_request:
    paths:
      - 'koningkoffie-checkmate/**'
      - '.github/scripts/*checkmate*'
      - '.github/workflows/*checkmate*'
      - 'README.md'
  push:
    branches: [master]
    paths:
      - 'koningkoffie-checkmate/**'
      - '.github/scripts/*checkmate*'
      - '.github/workflows/*checkmate*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    # MongoDB's pinned image rejects the newer kernels on 24.04/26.04 runners.
    # Revisit after adopting a MongoDB image with SERVER-131779 fixed:
    # https://github.com/actions/runner-images/issues/15005
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: python3 -m unittest discover -s .github/scripts -p 'test_checkmate*.py'
      - run: ruby .github/scripts/validate_checkmate.rb
      - run: node --test .github/scripts/test-checkmate-proxy.cjs
      - run: python3 .github/scripts/checkmate-smoke.py
      - run: git diff --check
