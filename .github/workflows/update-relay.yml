name: Update Relay

on:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: update-relay
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          # 1. Instruct checkout NOT to cache the standard background token
          persist-credentials: false 

      - name: Check upstream main
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: python3 .github/scripts/update_relay.py

      - name: Commit and publish the update
        id: publish
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail
          git diff --check
          git add -- \
            .github/workflows/build-relay.yml \
            koningkoffie-relay/Dockerfile \
            koningkoffie-relay/docker-compose.yml \
            koningkoffie-relay/umbrel-app.yml
          if git diff --cached --quiet; then
            echo "Relay is already current."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          # Fix: Standard, valid GitHub Actions bot email address
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@://github.com'
          git commit -m 'chore: update Relay from upstream main'
          
          # Fix: Completely hardcoded repository URL to bypass formatting and variable parsing issues
          git remote set-url origin "https://x-access-token:${TOKEN}@://github.com"
          
          git push origin "HEAD:${DEFAULT_BRANCH}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Build the updated image
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run build-relay.yml --ref "$DEFAULT_BRANCH"
