name: Validate Reactive Resume package

on:
  pull_request:
    paths:
      - 'koningkoffie-reactive-resume/**'
      - '.github/scripts/*reactive_resume*'
      - '.github/workflows/*reactive-resume*'
  push:
    branches: [master]
    paths:
      - 'koningkoffie-reactive-resume/**'
      - '.github/scripts/*reactive_resume*'
      - '.github/workflows/*reactive-resume*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: docker compose version
      - run: python3 -m unittest discover -s .github/scripts -p 'test_reactive_resume*.py'
      - run: bash -n koningkoffie-reactive-resume/exports.sh
      - run: git diff --check
