name: Update Checkmate and Capture

on:
  schedule:
    - cron: '43 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-checkmate
  cancel-in-progress: false

jobs:
  update:
    # MongoDB's pinned image rejects the newer kernels on 24.04/26.04 runners.
    # Revisit after adopting a MongoDB image with SERVER-131779 fixed:
    # https://github.com/actions/runner-images/issues/15005
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Test updater
        run: python3 -m unittest discover -s .github/scripts -p 'test_checkmate*.py'
      - name: Prepare stable release updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/update_checkmate.py
      - name: Detect package changes
        id: changes
        run: |
          if git diff --quiet -- koningkoffie-checkmate/docker-compose.yml koningkoffie-checkmate/umbrel-app.yml README.md; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "Checkmate and Capture are already current." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate Compose and Umbrel installer compatibility
        if: steps.changes.outputs.updated == 'true'
        run: |
          ruby .github/scripts/validate_checkmate.rb
          git diff --check
      - name: Runtime smoke test
        if: steps.changes.outputs.updated == 'true'
        run: |
          node --test .github/scripts/test-checkmate-proxy.cjs
          python3 .github/scripts/checkmate-smoke.py
      # GITHUB_TOKEN pushes do not trigger the separate push validation workflow.
      # Keep every required check above this step in the same job.
      - name: Publish tested update
        if: steps.changes.outputs.updated == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git diff --check
          git add -- koningkoffie-checkmate/docker-compose.yml koningkoffie-checkmate/umbrel-app.yml README.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: update Checkmate and Capture'
          # A concurrent change must reject this push. The next run will test
          # against the new default branch; never rebase or force-push here.
          git push origin "HEAD:${DEFAULT_BRANCH}"
          echo "Published tested Checkmate/Capture update: $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"
