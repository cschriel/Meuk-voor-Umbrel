name: Update Reactive Resume

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-reactive-resume
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Check for a stable release and verify its image
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/update_reactive_resume.py
      - name: Commit and publish the update
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git diff --check
          git add -- koningkoffie-reactive-resume/umbrel-app.yml koningkoffie-reactive-resume/docker-compose.yml
          if git diff --cached --quiet; then
            echo "No new release to publish."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: update Reactive Resume to the latest stable release'
          git push origin "HEAD:${DEFAULT_BRANCH}"
