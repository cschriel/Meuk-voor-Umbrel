tagline: Monitor uptime, response times, and incidents
icon: https://raw.githubusercontent.com/bluewave-labs/Checkmate/v3.12.0/client/public/checkmate_favicon.svg
description: >-
  Checkmate monitors service uptime, response times, and incidents with
  dashboards, notifications, and status pages. Keep an eye on your websites
  and services from your Umbrel.


  Open the app through Umbrel and create your administrator account on first
  launch. Use your Umbrel's local IPv4 address on port 52345. Accounts,
  settings, and monitoring history are stored in a persistent MongoDB database.


  To monitor Umbrel's Docker containers, add a Docker monitor with host URL
  unix:///var/run/docker.sock. The existing URL connects through a local filtered socket that allows
  container monitoring and bounded logs, but blocks Docker mutations and
  arbitrary file reads. Container environment variables are removed from
  inspection responses.


  Capture 1.4.0 is included for Umbrel hardware monitoring. In Infrastructure,
  add a monitor with endpoint http://UMBREL-IP:59232/api/v1/metrics, replacing
  UMBREL-IP with your Umbrel's local IPv4 address. For the authorization secret,
  use the app password shown by Umbrel, without a Bearer prefix. This password
  is Capture's API key; create your own Checkmate login on first launch.


  Capture reads host CPU, memory, disk, and network metrics using host
  networking and read-only host filesystem mounts. Temperature readings
  depend on available sensors. Its authenticated API listens on port 59232.
  S.M.A.R.T. disk health collection is not included in this configuration.


  Email delivery requires SMTP settings in Checkmate.
  Checkmate handles its own login; no additional Umbrel login
  is required. Public status pages are accessible to anyone who can reach
  the app on your network.


  MongoDB requires an x86-64 CPU with AVX or an ARMv8.2-A or newer CPU.
  Older hardware, including Raspberry Pi 4, is not supported by this package.
releaseNotes: "Harden secret generation, filter local Docker API access, migrate Checkmate to a database-scoped MongoDB account, improve readiness checks, and bound container logs. Existing monitor URLs, data, and encryption keys are preserved. Checkmate remains at 3.12.0 and Capture at 1.4.0."
